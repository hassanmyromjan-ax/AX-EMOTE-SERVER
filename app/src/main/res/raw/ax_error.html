<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:#000;color:#fff;font-family:sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;
background:radial-gradient(circle at 50% 0%,#33104a 0%,#080716 55%,#000 100%)}
.wrap{width:100%;padding:20px 16px;text-align:center}
.icon{width:clamp(72px,30vw,130px);height:clamp(72px,30vw,130px);margin:0 auto 16px;display:block;
filter:drop-shadow(0 0 14px rgba(255,40,215,.7))}
.arc{animation:pulse 1.6s ease-in-out infinite}
.a2{animation-delay:.25s}.a3{animation-delay:.5s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
h1{font-size:clamp(22px,8vw,36px);font-weight:900;line-height:1.2;letter-spacing:.5px;
text-shadow:0 0 18px rgba(255,40,215,.55)}
h1 b{color:#ff3b6b}
p{margin-top:14px;font-size:clamp(15px,4.6vw,21px);color:#cfd0ee;font-weight:700}
a.btn{display:inline-block;margin-top:28px;padding:14px 38px;border-radius:999px;color:#fff;
text-decoration:none;font-weight:900;letter-spacing:2px;font-size:clamp(14px,4.6vw,18px);
background:linear-gradient(90deg,#ff1f5a,#b300ff);box-shadow:0 6px 24px rgba(255,31,90,.5)}
a.btn:active{transform:scale(.95)}
</style>
</head>
<body>
<div class="wrap">
<svg class="icon" viewBox="0 0 64 64" fill="none" stroke="#ff28d7" stroke-width="5" stroke-linecap="round">
<path class="arc a3" d="M6 24c14-12 38-12 52 0"/>
<path class="arc a2" d="M16 34c9-8 23-8 32 0"/>
<path class="arc" d="M26 44c4-3.5 8-3.5 12 0"/>
<circle cx="32" cy="53" r="3" fill="#ff28d7" stroke="none"/>
<path d="M9 8L55 58" stroke="#ff3b3b"/>
</svg>
<h1>Your Internet<br><b>Connection Error</b></h1>
<p>Please On Your Internet 🛜</p>
<a class="btn" href="axrefresh://retry">REFRESH</a>
</div>
</body>
</html>
