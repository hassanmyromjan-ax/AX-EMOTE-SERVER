<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;font-family:sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;
background:radial-gradient(circle at 50% 0%,#33104a 0%,#080716 55%,#000 100%)}
.wrap{text-align:center;padding:16px}
.box{position:relative;width:clamp(84px,30vw,130px);height:clamp(84px,30vw,130px);margin:0 auto 18px}
.box svg{position:absolute;left:0;top:0;width:100%;height:100%}
.ring{transform-origin:50% 50%;animation:spin 1.1s linear infinite}
.arc{animation:blink 1.2s ease-in-out infinite;opacity:.2}
.a2{animation-delay:.2s}.a3{animation-delay:.4s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes dots{0%,100%{opacity:.15}50%{opacity:1}}
h2{font-size:clamp(20px,6.5vw,30px);font-weight:900;letter-spacing:1px}
h2 i{font-style:normal;animation:dots 1.2s infinite}
h2 i:nth-child(2){animation-delay:.2s}
h2 i:nth-child(3){animation-delay:.4s}
</style>
</head>
<body>
<div class="wrap">
<div class="box">
<svg viewBox="0 0 100 100" fill="none" stroke-linecap="round">
<circle cx="50" cy="50" r="45" stroke="#2a1648" stroke-width="5"/>
<circle class="ring" cx="50" cy="50" r="45" stroke="#ff2bd6" stroke-width="5" stroke-dasharray="70 213"/>
<g stroke="#ffe24d" stroke-width="5">
<path class="arc a3" d="M27 42c14-11 32-11 46 0"/>
<path class="arc a2" d="M35 52c9-7 21-7 30 0"/>
<path class="arc" d="M43 62c4-3 10-3 14 0"/>
</g>
<circle cx="50" cy="71" r="3.2" fill="#ffe24d"/>
</svg>
</div>
<h2>Loading<i>.</i><i>.</i><i>.</i></h2>
</div>
</body>
</html>
