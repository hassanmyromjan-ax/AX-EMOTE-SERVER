name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AX_KEYSTORE_BASE64: ${{ secrets.AX_KEYSTORE_BASE64 }}
      AX_STORE_PASSWORD: ${{ secrets.AX_STORE_PASSWORD }}
      AX_KEY_ALIAS: ${{ secrets.AX_KEY_ALIAS }}
      AX_KEY_PASSWORD: ${{ secrets.AX_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Build signed release APK (only if signing secrets exist)
        if: ${{ env.AX_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$AX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ax-release.jks"
          export AX_KEYSTORE_PATH="$RUNNER_TEMP/ax-release.jks"
          gradle assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ax-emote-server-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
